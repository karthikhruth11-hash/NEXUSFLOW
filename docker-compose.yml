services:
  mongo:
    image: mongo:7.0
    container_name: nexusflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexusflow
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexusflow-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nexusflow
      MONGODB_DB_NAME: nexusflow
      JWT_ACCESS_SECRET: dev-secret-for-docker-compose-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-for-docker-compose-change-me
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexusflow-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
